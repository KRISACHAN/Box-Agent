policy:
  risky_inputs_usage: "仅用于内部分类和风险识别，不得进入最终 prompt、海报文字、文件名、alt text、metadata 或发布文案。"
  commercial_combination_limit: "正式商用海报同一画面最多保留 2-3 个抽象线索，避免叠加颜色、号码、年龄、标志动作、具体战绩和经典事件。"
  event_name_rule: "输出默认使用足球盛会、冠军夜、巅峰赛季等泛化表述，不把官方赛事名作为商业主标题或 CTA。"
metaphors:
