templates:
  - id: luxury_champion
    name: 豪华冠军海报
    ratio: "3:4"
    best_for:
      - 传奇致敬
      - 冠军夜
      - 生日纪念
      - 破纪录时刻
    visual_formula:
      background: "premium warm ivory linen paper wall, subtle grain"
      structure: "precision-carved football-shaped archway, beveled edges, deep inner shadow"
      atmosphere: "cinematic stadium haze, confetti, smoke trails, flowers, balloons, trophy silhouettes"
      lighting: "warm golden-hour key light, stadium tungsten ambience, soft rim light"
      typography: "gold foil Chinese title, bronze subtitle, cream-gold body copy"
      depth: "3D breakout effect with natural drop shadows"
    required_slots:
      - title
      - subtitle
      - body
      - ip_description
      - hero_metaphor
    safety_constraints:
      - no real human celebrity portrait
      - no real player name unless non-commercial user explicitly accepts risk and system policy allows
      - no official federation, club, event, sponsor, sportswear logo
      - no official jersey replication
      - no misleading endorsement wording

  - id: match_report_cover
    name: 战报封面
    ratio: "3:4 or 16:9"
    best_for:
      - 比赛结果
      - 社群战报
      - 企业足球赛
      - MVP海报
    visual_formula:
      background: "dramatic stadium lights and pitch texture"
      structure: "large score block, player/IP hero cutout, event timeline"
      atmosphere: "motion blur, grass particles, goal net depth"
      typography: "bold numeric score, clear Chinese match notes"
    required_slots:
      - score
      - title
      - mvp_or_hero
      - key_moment
      - ip_description
    safety_constraints:
      - use original teams or generic team colors
      - avoid real club names and badges
      - avoid real player likeness

  - id: vintage_star_card
    name: 复古球星卡
    ratio: "2:3 or 3:4"
    best_for:
      - 收藏卡
      - 社群头像
      - 战绩纪念
      - 球迷纪念日
    visual_formula:
      background: "aged paper, gold frame, subtle halftone texture"
      structure: "card border, rating panels, symbolic icons, jersey number"
      atmosphere: "nostalgic collectible card, premium foil edges"
      typography: "clear Chinese card title and numeric stats"
    required_slots:
      - card_title
      - number
      - traits
      - ip_description
    safety_constraints:
      - no official card game layout imitation
      - no official club or country marks
      - no real-person face

  - id: cinematic_hero
    name: 电影英雄海报
    ratio: "3:4"
    best_for:
      - 英雄归来
      - 逆转故事
      - 热血预热
      - 传奇叙事
    visual_formula:
      background: "rainy night stadium or dramatic tunnel silhouette"
      structure: "center hero, backlight, large title, compact subtitle"
      atmosphere: "cinematic contrast, sparks, mist, emotional storytelling"
      typography: "movie-poster Chinese title, minimal supporting copy"
    required_slots:
      - title
      - tagline
      - ip_description
      - hero_metaphor
    safety_constraints:
      - avoid copying specific movie posters
      - avoid real player names and official marks
